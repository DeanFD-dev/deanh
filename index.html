<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Time Log">
<meta name="theme-color" content="#0f172a">
<title>Time Log</title>
<style>
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface-2: #243044;
    --surface-3: #0f172a;
    --border: #334155;
    --border-2: #475569;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --text-dimmer: #64748b;
    --text-bright: #f1f5f9;
    --accent: #38bdf8;
    --accent-text: #0f172a;
    --danger: #ef4444;
    --danger-bg: #450a0a;
    --danger-text: #fca5a5;
    --highlight: rgba(250, 204, 21, 0.25);
    --shadow: rgba(0, 0, 0, 0.3);
  }
  [data-theme="light"] {
    --bg: #f8fafc;
    --surface: #ffffff;
    --surface-2: #f1f5f9;
    --surface-3: #f8fafc;
    --border: #e2e8f0;
    --border-2: #cbd5e1;
    --text: #1e293b;
    --text-dim: #64748b;
    --text-dimmer: #94a3b8;
    --text-bright: #0f172a;
    --accent: #0284c7;
    --accent-text: #ffffff;
    --danger: #dc2626;
    --danger-bg: #fee2e2;
    --danger-text: #991b1b;
    --highlight: rgba(250, 204, 21, 0.4);
    --shadow: rgba(0, 0, 0, 0.08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; min-height: 100dvh;
    overscroll-behavior-y: contain;
    transition: background 0.2s ease, color 0.2s ease;
  }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .app { max-width: 600px; margin: 0 auto; padding: 16px 16px 220px; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; padding-top: 8px; gap: 12px; }
  .header-left { display: flex; flex-direction: column; gap: 2px; }
  .date { font-size: 14px; color: var(--text-dim); font-weight: 500; }
  .total { font-size: 14px; color: var(--text-dim); }
  .total strong { color: var(--text-bright); font-weight: 600; }
  .theme-toggle { background: var(--surface); border: 1px solid var(--border); color: var(--text); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; padding: 0; }
  .tabs { display: flex; gap: 4px; background: var(--surface); border-radius: 10px; padding: 4px; margin-bottom: 16px; }
  .tab { flex: 1; background: transparent; border: none; color: var(--text-dim); padding: 8px 12px; border-radius: 7px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; }
  .tab.active { background: var(--surface-2); color: var(--text-bright); }
  .entries { display: flex; flex-direction: column; gap: 8px; }
  .empty { text-align: center; padding: 60px 20px; color: var(--text-dimmer); font-size: 15px; line-height: 1.5; }
  .entry { background: var(--surface); border-radius: 12px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; }
  .entry-meta { display: flex; flex-direction: column; gap: 2px; min-width: 72px; }
  .entry-time { font-size: 13px; font-weight: 600; color: var(--accent); padding-top: 1px; cursor: pointer; font-variant-numeric: tabular-nums; }
  .entry-duration { font-size: 12px; color: var(--text-dim); cursor: pointer; font-variant-numeric: tabular-nums; }
  .entry-text { flex: 1; font-size: 15px; line-height: 1.4; color: var(--text); word-wrap: break-word; cursor: pointer; }
  .entry-text.highlight { background: var(--highlight); border-radius: 4px; padding: 1px 4px; margin: -1px -4px; }
  .entry-delete { background: transparent; border: none; color: var(--text-dimmer); font-size: 18px; cursor: pointer; padding: 0 4px; line-height: 1; }
  .entry-delete:active { color: var(--danger); }
  .entry input.edit-input { flex: 1; background: var(--surface-3); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 6px 8px; font-size: 15px; font-family: inherit; }

  .search-row { margin-bottom: 12px; }
  .search-input { width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 10px 14px; font-size: 15px; font-family: inherit; }
  .search-input::placeholder { color: var(--text-dimmer); }
  .archive-day { background: var(--surface); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
  .archive-day-header { display: flex; justify-content: space-between; align-items: center; padding: 14px; cursor: pointer; user-select: none; }
  .archive-day-header:active { background: var(--surface-2); }
  .archive-day-left { display: flex; align-items: center; gap: 10px; }
  .archive-chevron { color: var(--text-dimmer); font-size: 12px; transition: transform 0.2s ease; display: inline-block; }
  .archive-day.expanded .archive-chevron { transform: rotate(90deg); }
  .archive-date { font-size: 15px; font-weight: 600; color: var(--text-bright); }
  .archive-meta { font-size: 13px; color: var(--text-dim); }
  .archive-body { display: none; padding: 0 14px 14px; border-top: 1px solid var(--border); }
  .archive-day.expanded .archive-body { display: block; }
  .archive-entries { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; margin-bottom: 12px; }
  .archive-entry { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; background: var(--surface-3); border-radius: 8px; }
  .archive-entry-meta { display: flex; flex-direction: column; gap: 1px; min-width: 70px; }
  .archive-entry-time { font-size: 12px; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; cursor: pointer; }
  .archive-entry-duration { font-size: 11px; color: var(--text-dim); font-variant-numeric: tabular-nums; cursor: pointer; }
  .archive-entry-text { flex: 1; font-size: 14px; line-height: 1.35; color: var(--text); word-wrap: break-word; cursor: pointer; }
  .archive-entry-text.highlight { background: var(--highlight); border-radius: 4px; padding: 1px 4px; margin: -1px -4px; }
  .archive-entry-delete { background: transparent; border: none; color: var(--text-dimmer); font-size: 16px; cursor: pointer; padding: 0 4px; line-height: 1; }
  .archive-entry input.edit-input { flex: 1; background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 4px 6px; font-size: 14px; font-family: inherit; }
  .archive-actions { display: flex; gap: 8px; }
  .archive-btn { flex: 1; background: var(--surface-2); border: none; color: var(--text); padding: 8px; border-radius: 7px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; }
  .archive-btn.danger { background: var(--danger-bg); color: var(--danger-text); }

  .action-bar { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 70%, transparent); display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .quick-area { display: flex; align-items: center; gap: 6px; width: 100%; max-width: 500px; min-height: 36px; }
  .quick-row { display: flex; gap: 6px; overflow-x: auto; flex: 1 1 auto; min-width: 0; padding-bottom: 4px; scrollbar-width: none; align-items: center; }
  .quick-row::-webkit-scrollbar { display: none; }
  .quick-btn { flex: 0 0 auto; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 16px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; white-space: nowrap; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
  .quick-btn:active { background: var(--surface-2); }
  .quick-btn.edit { flex: 0 0 auto; color: var(--text-dim); border: 1px dashed var(--border); background: var(--surface); padding: 6px 10px; border-radius: 16px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; white-space: nowrap; max-width: none; }
  .mic-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .mic-meter { display: flex; gap: 3px; height: 16px; align-items: center; opacity: 0; transition: opacity 0.2s; }
  .mic-meter.active { opacity: 1; }
  .mic-bar { width: 4px; background: var(--danger); border-radius: 2px; height: 4px; transition: height 0.08s ease-out; }
  .mic-button { width: 72px; height: 72px; border-radius: 50%; border: none; background: var(--accent); color: var(--accent-text); font-size: 32px; cursor: pointer; box-shadow: 0 8px 24px rgba(56,189,248,0.35); transition: transform 0.1s ease, background 0.15s ease; display: flex; align-items: center; justify-content: center; }
  .mic-button:active { transform: scale(0.95); }
  .mic-button.listening { background: var(--danger); animation: pulse 1.2s ease-in-out infinite; box-shadow: 0 8px 24px rgba(239,68,68,0.4); }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .secondary-actions { display: flex; gap: 8px; width: 100%; max-width: 400px; }
  .secondary-btn { flex: 1; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; }
  .secondary-btn.primary { background: var(--surface-2); border-color: var(--border-2); }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: flex-end; justify-content: center; z-index: 100; }
  .modal-backdrop.show { display: flex; }
  .modal { background: var(--surface); width: 100%; max-width: 500px; border-radius: 16px 16px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); animation: slideUp 0.2s ease-out; max-height: 90vh; overflow-y: auto; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal h3 { margin: 0 0 12px; font-size: 16px; color: var(--text-dim); font-weight: 500; }
  .modal-input { width: 100%; background: var(--surface-3); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 12px; font-size: 16px; font-family: inherit; margin-bottom: 12px; resize: none; min-height: 80px; }
  .compact-row { display: flex; gap: 12px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
  .compact-row > div { display: flex; align-items: center; gap: 6px; }
  .compact-row label { font-size: 13px; color: var(--text-dim); }
  .compact-row input[type="time"] { background: var(--surface-3); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 6px 8px; font-size: 14px; font-family: inherit; }
  .duration-row { margin-bottom: 12px; }
  .duration-row .label { font-size: 13px; color: var(--text-dim); margin-bottom: 6px; }
  .duration-options { display: flex; gap: 6px; flex-wrap: wrap; }
  .dur-btn { flex: 1; min-width: 56px; background: var(--surface-3); border: 1px solid var(--border); color: var(--text); padding: 9px 6px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; }
  .dur-btn.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .custom-duration { display: none; margin-top: 8px; align-items: center; gap: 8px; }
  .custom-duration.show { display: flex; }
  .custom-duration label { font-size: 13px; color: var(--text-dim); }
  .custom-duration input { background: var(--surface-3); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 8px 10px; font-size: 15px; font-family: inherit; width: 90px; }
  .modal-buttons { display: flex; gap: 8px; margin-top: 4px; }
  .modal-btn { flex: 1; border: none; padding: 12px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .modal-btn.cancel { background: var(--surface-2); color: var(--text); }
  .modal-btn.confirm { background: var(--accent); color: var(--accent-text); }
  .modal-btn.redo { background: var(--border-2); color: var(--text); }

  .quick-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .quick-item { display: flex; gap: 8px; align-items: center; background: var(--surface-3); padding: 8px; border-radius: 8px; }
  .quick-item input.qi-name { flex: 1; background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 6px 8px; font-size: 14px; font-family: inherit; }
  .quick-item input.qi-mins { width: 70px; background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 6px 8px; font-size: 14px; font-family: inherit; }
  .quick-item .qi-mins-label { font-size: 12px; color: var(--text-dim); }
  .quick-item button.qi-del { background: transparent; border: none; color: var(--text-dimmer); font-size: 18px; cursor: pointer; padding: 0 4px; }
  .qi-add { background: var(--surface-2); border: 1px dashed var(--border); color: var(--text-dim); padding: 10px; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 14px; }

  .toast { position: fixed; top: calc(20px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%) translateY(-100px); background: var(--surface); color: var(--text); padding: 10px 16px; border-radius: 10px; font-size: 14px; box-shadow: 0 4px 12px var(--shadow); transition: transform 0.25s ease; z-index: 200; border: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error { border-color: var(--danger); }
  .toast button { background: var(--accent); border: none; color: var(--accent-text); padding: 4px 10px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-left">
      <div class="date" id="date"></div>
      <div class="total">Today: <strong id="total">—</strong></div>
    </div>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">🌙</button>
  </div>
  <div class="tabs">
    <button class="tab active" data-view="today">Today</button>
    <button class="tab" data-view="history">History</button>
  </div>
  <div id="today-view"><div class="entries" id="entries"></div></div>
  <div id="history-view" style="display: none;">
    <div class="search-row"><input type="search" class="search-input" id="search-input" placeholder="Search entries…"></div>
    <div id="archive-list"></div>
  </div>
</div>

<div class="action-bar" id="action-bar">
  <div class="quick-area">
    <div class="quick-row" id="quick-row"></div>
    <button class="quick-btn edit" id="quick-edit-btn-pinned" aria-label="Edit quick buttons">✏️</button>
  </div>
  <div class="mic-wrap">
    <button class="mic-button" id="mic" aria-label="Record voice entry">🎤</button>
    <div class="mic-meter" id="mic-meter">
      <div class="mic-bar"></div><div class="mic-bar"></div><div class="mic-bar"></div>
      <div class="mic-bar"></div><div class="mic-bar"></div><div class="mic-bar"></div>
      <div class="mic-bar"></div><div class="mic-bar"></div><div class="mic-bar"></div>
    </div>
  </div>
  <div class="secondary-actions">
    <button class="secondary-btn" id="manual-btn">Type entry</button>
    <button class="secondary-btn primary" id="export-btn">Export day</button>
  </div>
</div>

<div class="modal-backdrop" id="confirm-modal">
  <div class="modal">
    <h3 id="confirm-heading">I heard:</h3>
    <textarea class="modal-input" id="confirm-text"></textarea>
    <div class="compact-row">
      <div><label>Time:</label><input type="time" id="confirm-time"></div>
    </div>
    <div class="duration-row">
      <div class="label">Duration:</div>
      <div class="duration-options" data-target="confirm">
        <button class="dur-btn" data-mins="15">15m</button>
        <button class="dur-btn" data-mins="30">30m</button>
        <button class="dur-btn" data-mins="60">1h</button>
        <button class="dur-btn" data-mins="120">2h</button>
        <button class="dur-btn" data-mins="custom">Custom</button>
      </div>
      <div class="custom-duration" id="confirm-custom-row">
        <label>Minutes:</label>
        <input type="number" id="confirm-custom-mins" min="1" max="1440" inputmode="numeric">
      </div>
    </div>
    <div class="modal-buttons">
      <button class="modal-btn cancel" id="confirm-cancel">Cancel</button>
      <button class="modal-btn redo" id="confirm-redo">🎤 Redo</button>
      <button class="modal-btn confirm" id="confirm-save">Log it</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="edit-dur-modal">
  <div class="modal">
    <h3>Edit duration</h3>
    <div class="duration-row">
      <div class="duration-options" data-target="editdur">
        <button class="dur-btn" data-mins="15">15m</button>
        <button class="dur-btn" data-mins="30">30m</button>
        <button class="dur-btn" data-mins="60">1h</button>
        <button class="dur-btn" data-mins="120">2h</button>
        <button class="dur-btn" data-mins="custom">Custom</button>
      </div>
      <div class="custom-duration" id="editdur-custom-row">
        <label>Minutes:</label>
        <input type="number" id="editdur-custom-mins" min="0" max="1440" inputmode="numeric">
      </div>
    </div>
    <div class="modal-buttons">
      <button class="modal-btn cancel" id="editdur-cancel">Cancel</button>
      <button class="modal-btn confirm" id="editdur-save">Save</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="quick-edit-modal">
  <div class="modal">
    <h3>Manage quick buttons</h3>
    <div class="quick-list" id="quick-list"></div>
    <button class="qi-add" id="qi-add">+ Add quick button</button>
    <div class="modal-buttons" style="margin-top: 16px;">
      <button class="modal-btn cancel" id="qe-cancel">Cancel</button>
      <button class="modal-btn confirm" id="qe-save">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
  const memStore = {};
  const storage = {
    get(key) { try { const v = localStorage.getItem(key); return v === null ? null : JSON.parse(v); } catch (e) { return memStore[key] === undefined ? null : memStore[key]; } },
    set(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { memStore[key] = val; } }
  };
  const TODAY_KEY = 'timelog_today', TODAY_DATE_KEY = 'timelog_today_date', ARCHIVE_KEY = 'timelog_archive', THEME_KEY = 'timelog_theme', QUICK_KEY = 'timelog_quick';

  function migrateEntries(entries) {
    return (entries || []).map(e => ({ ...e, durationMins: typeof e.durationMins === 'number' ? e.durationMins : 0 }));
  }
  let todayEntries = migrateEntries(storage.get(TODAY_KEY) || []);
  let todayDate = storage.get(TODAY_DATE_KEY) || todayString();
  let archive = (storage.get(ARCHIVE_KEY) || []).map(d => ({ ...d, entries: migrateEntries(d.entries) }));
  const expandedDays = new Set();
  let searchQuery = '';
  let quickButtons = storage.get(QUICK_KEY);
  if (!Array.isArray(quickButtons) || quickButtons.length === 0) {
    quickButtons = [
      { name: 'Standup', mins: 15 },
      { name: 'Email', mins: 30 },
      { name: 'Lunch', mins: 60 },
      { name: 'Break', mins: 15 }
    ];
  }

  function checkDateRollover() {
    const now = todayString();
    if (todayDate !== now) {
      if (todayEntries.length > 0) {
        archive.unshift({ date: todayDate, entries: todayEntries });
        storage.set(ARCHIVE_KEY, archive);
      }
      todayEntries = []; todayDate = now;
      storage.set(TODAY_KEY, todayEntries); storage.set(TODAY_DATE_KEY, todayDate);
      render();
    }
  }
  checkDateRollover();
  setInterval(checkDateRollover, 60000);

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    document.getElementById('theme-toggle').textContent = theme === 'light' ? '☀️' : '🌙';
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'light' ? '#f8fafc' : '#0f172a');
  }
  let currentTheme = storage.get(THEME_KEY) || 'dark';
  applyTheme(currentTheme);
  document.getElementById('theme-toggle').addEventListener('click', () => {
    currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
    storage.set(THEME_KEY, currentTheme);
    applyTheme(currentTheme);
  });

  function todayString() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
  function pad(n) { return String(n).padStart(2, '0'); }
  function nowTimeString() { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function formatTime12(t) { const [h,m] = t.split(':').map(Number); const period = h>=12?'PM':'AM'; const h12 = h%12||12; return h12+':'+pad(m)+' '+period; }
  function formatDateLong(dateStr) { const [y,m,d] = dateStr.split('-').map(Number); const dt = new Date(y, m-1, d); return dt.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' }); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
  function formatDuration(mins) {
    if (!mins || mins <= 0) return '0m';
    const h = Math.floor(mins/60), m = mins%60;
    if (h && m) return h+'h '+m+'m';
    if (h) return h+'h';
    return m+'m';
  }
  function totalMinutes(entries) { return entries.reduce((sum, e) => sum + (e.durationMins || 0), 0); }
  function saveToday() { storage.set(TODAY_KEY, todayEntries); storage.set(TODAY_DATE_KEY, todayDate); }
  function saveArchive() { storage.set(ARCHIVE_KEY, archive); }
  function saveQuick() { storage.set(QUICK_KEY, quickButtons); }
  function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  const entriesEl = document.getElementById('entries');
  const archiveListEl = document.getElementById('archive-list');
  const dateEl = document.getElementById('date');
  const totalEl = document.getElementById('total');
  const quickRowEl = document.getElementById('quick-row');

  function render() {
    dateEl.textContent = formatDateLong(todayDate);
    const totalMins = totalMinutes(todayEntries);

    if (!q) return escapeHtml(text);

    if (idx < 0) return escapeHtml(text);

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const micBtn = document.getElementById('mic');
  const micMeter = document.getElementById('mic-meter');
  const micBars = micMeter.querySelectorAll('.mic-bar');
  let recognition = null;
  let listening = false;
  let lastTranscript = '';
  let listenTimeout = null;
  let resultReceived = false;
  let audioCtx = null;
  let micStream = null;
  let analyser = null;
  let meterRaf = null;

  if (!SpeechRecognition) { micBtn.disabled = true; micBtn.style.opacity = '0.5'; }

  async function startMeter() {
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createMediaStreamSource(micStream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      source.connect(analyser);
      const data = new Uint8Array(analyser.frequencyBinCount);
      micMeter.classList.add('active');
      const tick = () => {
        if (!analyser) return;
        analyser.getByteFrequencyData(data);
        const segLen = Math.floor(data.length / micBars.length);
        micBars.forEach((bar, i) => {
          let sum = 0;
          for (let j = 0; j < segLen; j++) sum += data[i*segLen + j];
          const avg = sum / segLen;
          const h = Math.max(4, Math.min(16, (avg / 255) * 24));
          bar.style.height = h + 'px';
        });
        meterRaf = requestAnimationFrame(tick);
      };
      tick();
    } catch (e) {}
  }
  function stopMeter() {
    micMeter.classList.remove('active');
    if (meterRaf) cancelAnimationFrame(meterRaf);
    meterRaf = null;
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    if (audioCtx) { try { audioCtx.close(); } catch(e){} audioCtx = null; }
    analyser = null;
    micBars.forEach(b => b.style.height = '4px');
  }

  function startListening() {
    if (!SpeechRecognition) { showToast('Voice not supported on this device', true); return; }
    if (listening) return;
    try { recognition = new SpeechRecognition(); }
    catch (e) { showToast('Could not create recognizer', true); return; }
    recognition.lang = navigator.language || 'en-US';
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;
    recognition.continuous = false;
    lastTranscript = '';
    resultReceived = false;
    listening = true;
    micBtn.classList.add('listening');
    micBtn.textContent = '●';
    recognition.onstart = () => { showToast('Listening…'); startMeter(); };
    recognition.onresult = (event) => {
      resultReceived = true;
      let finalText = '', interimText = '';
      for (let i = 0; i < event.results.length; i++) {
        const t = event.results[i][0].transcript;
        if (event.results[i].isFinal) finalText += t;
        else interimText += t;
      }
      const combined = (finalText || interimText).trim();
      if (combined) lastTranscript = combined;
    };
    recognition.onerror = (event) => {
      const err = event.error;
      const captured = lastTranscript;
      finishListening();
      if (err === 'not-allowed' || err === 'service-not-allowed') showToast('Microphone permission denied', true);
      else if (err === 'no-speech') showToast("Didn't catch that — try again", true);
      else if (err === 'aborted') { if (captured) openConfirm(captured); }
      else showToast('Voice error: ' + err, true);
    };
    recognition.onend = () => {
      const captured = lastTranscript;
      const had = resultReceived;
      finishListening();
      if (captured) openConfirm(captured);
      else if (had) showToast('Heard nothing — try again', true);
      else showToast("Didn't catch anything — try again", true);
    };
    try { recognition.start(); }
    catch (e) { finishListening(); showToast('Could not start mic: ' + e.message, true); return; }
    listenTimeout = setTimeout(() => { if (listening) forceStop(); }, 60000);
  }

  function finishListening() {
    listening = false;
    micBtn.classList.remove('listening');
    micBtn.textContent = '🎤';
    if (listenTimeout) { clearTimeout(listenTimeout); listenTimeout = null; }
    recognition = null;
    stopMeter();
  }

  function forceStop() {
    if (recognition) {
      try { recognition.stop(); } catch (e) {}
      try { recognition.abort(); } catch (e) {}
    }
    setTimeout(() => {
      if (listening) {
        const captured = lastTranscript;
        finishListening();
        if (captured) openConfirm(captured);
        else showToast('Stopped — nothing captured', true);
      }
    }, 500);
  }

  micBtn.addEventListener('click', () => { if (listening) forceStop(); else startListening(); });

  function csvCell(v) { const s = String(v); if (/[",\r\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"'; return s; }
  function buildCSV(date, entries) {
    const sorted = [...entries].sort((a,b) => a.time.localeCompare(b.time));
    const rows = [['Date', 'Time', 'Duration (min)', 'Entry']];
    sorted.forEach(e => rows.push([date, formatTime12(e.time), e.durationMins || 0, e.text]));
    const total = totalMinutes(sorted);
    rows.push(['', '', total, 'TOTAL']);
    return rows.map(r => r.map(csvCell).join(',')).join('\r\n');
  }
  async function shareCSV(date, entries) {
    const csv = buildCSV(date, entries);
    const csvWithBom = '\uFEFF' + csv;
    const filename = 'timelog-' + date + '.csv';
    const file = new File([csvWithBom], filename, { type: 'text/csv;charset=utf-8' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ title: 'Time Log ' + date, files: [file] }); return true; }
      catch (e) { if (e.name === 'AbortError') return false; }
    }
    const blob = new Blob([csvWithBom], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    return true;
  }
  document.getElementById('export-btn').addEventListener('click', async () => {

  let toastTimer;
  function showToast(msg, isError) {

  function showUndoToast(msg) {
    const t = document.getElementById('toast');

    const btn = document.createElement('button'); btn.textContent = 'Undo';

    t.appendChild(span); t.appendChild(btn);

  document.addEventListener('keydown', (e) => {
    const tag = (e.target.tagName || '').toLowerCase();
    const inField = tag === 'input' || tag === 'textarea' || e.target.isContentEditable;
    if (e.key === 'Escape') {
      document.querySelectorAll('.modal-backdrop.show').forEach(m => m.classList.remove('show'));
      return;
    }
    if (inField) return;
    if (e.code === 'Space') { e.preventDefault(); if (listening) forceStop(); else startListening(); return; }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'n') { e.preventDefault(); document.getElementById('manual-btn').click(); return; }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'e') { e.preventDefault(); document.getElementById('export-btn').click(); return; }
  });

  render();
</script>
</body>
</html>
